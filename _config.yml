# Welcome to Jekyll!
#
# This config file is meant for settings that affect your entire site, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# `jekyll serve -l -H localhost`. If you change this file, please restart the
# server process.

# Basic Site Settings
locale                   : "en-US"
title                    : "Guangcai Qian's Personal Homepage"
title_separator          : "-"
name                     : &name "Guangcai Qian"
description              : &description "Doctoral researcher in structural engineering focusing on AI-driven diagnosis of concrete durability and structural health monitoring."
url                      : "https://GuangcaiQian.github.io"
baseurl                  : ""
repository               : "GuangcaiQian/GuangcaiQian.github.io"

# Site Author
author:
  # Biographic information
  avatar           : "美式证件照.png"
  name             : "Guangcai Qian 钱广才"
  pronouns         :
  bio              : "Ph.D. Student | Structural Engineering"
  location         : "Xi'an, China"
  employer         : "School of Civil Engineering, Xi'an University of Architecture and Technology"
  email            : "qianguangcai@xauat.edu.cn"

  # Academic websites
  arxiv            :
  googlescholar    : "https://scholar.google.com/citations?user=Rr5j-X0AAAAJ&hl=zh-CN"
  impactstory      :
  orcid            : "https://orcid.org/0009-0008-4869-8432"
  semantic         :
  pubmed           :
  researchgate     :

  # Repositories and software development
  bitbucket        :
  codepen          :
  dribbble         :
  github           : "GuangcaiQian"
  kaggle           :
  stackoverflow    :

  # Social media
  bluesky          :
  facebook         : "profile.php?id=100036247702968"
  flickr           :
  foursquare       :
  goodreads        :
  google_plus      :
  keybase          :
  instagram        :
  lastfm           :
  linkedin         :
  mastodon         :
  medium           :
  pinterest        :
  soundcloud       :
  steam            :
  telegram         :
  tumblr           :
  twitter          : "qianguang3"
  vine             :
  weibo            : "u/5897655727"
  wikipedia        :
  xing             :
  youtube          :
  zhihu            : "https://www.zhihu.com/people/wen-sen-te-zhu-56"

# Publication Category
publication_category:
  books:
    title: "Books"
  manuscripts:
    title: "Journal Articles"
  conferences:
    title: "Conference Papers"

# Site Settings
teaser                   :
breadcrumbs              : false
words_per_minute         : 160
future                   : true
read_more                : "disabled"
talkmap_link             : false

comments:
  provider               :
  disqus:
    shortname            :
  discourse:
    server               :
  facebook:
    appid                :
    num_comments         :
    colorscheme          :

staticman:
  allowedFields:
    - name
    - email
    - url
    - message
  branch: "gh-pages"
  commitMessage: "New comment."
  filename: "comment-{@timestamp}"
  format: "yml"
  moderation: true
  path: "_data/comments/{options.slug}"
  requiredFields:
    - name
    - email
    - message
  transforms:
    email: "md5"
  generatedFields:
    date:
      type: "date"
      options:
        format: "iso8601"

atom_feed:
  hide                   : false
  path                   :

# SEO Related
google_site_verification :
bing_site_verification   :
alexa_site_verification  :
yandex_site_verification :

# Social Sharing
twitter:
  username               : &twitter "qianguang3"

facebook:
  username               :
  app_id                 :
  publisher              :

og_image                 :

# Social profiles
social:
  type                   : "Person"
  name                   : "Guangcai Qian"
  links:
    - "https://github.com/GuangcaiQian"
    - "https://scholar.google.com/citations?user=Rr5j-X0AAAAJ&hl=zh-CN"
    - "https://orcid.org/0009-0008-4869-8432"
    - "https://x.com/qianguang3"
    - "https://www.zhihu.com/people/wen-sen-te-zhu-56"

# Analytics
analytics:
  provider               : "false"
  google:
    tracking_id          :

# Reading Files
include:
  - .htaccess
  - _pages
  - files

exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - Capfile
  - config
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - log
  - node_modules
  - package.json*
  - Rakefile
  - README
  - tmp
  - vendor

keep_files:
  - .git
  - .svn

encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Collections
collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/

# Defaults
defaults:
  # Posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true

  # Pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

  # Teaching
  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true
      share: true
      comments: true

  # Publications
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: true
      comments: true

  # Portfolio
  - scope:
      path: ""
      type: portfolio
    values:
      layout: single
      author_profile: true
      share: true
      comment: true

  # Talks
  - scope:
      path: ""
      type: talks
    values:
      layout: talk
      author_profile: true
      share: true

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed

# Outputting
permalink: /:categories/:title/
timezone: Asia/Shanghai

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-redirect-from

# GitHub Pages-compatible plugins
whitelist:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji

# Archives
category_archive:
  type: liquid
  path: /categories/

tag_archive:
  type: liquid
  path: /tags/

# HTML Compression
compress_html:
  clippings: all
  ignore:
    envs: development
